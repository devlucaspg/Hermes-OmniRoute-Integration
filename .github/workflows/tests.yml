name: Offline contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q backend model-provider
      - run: node --check backend/dashboard/dist/index.js

  hermes-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend using the official Hermes validator
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@v0.23.2
        with:
          path: ./backend
          hermes-ref: v0.23.2
      - name: Validate model provider using the official Hermes validator
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@v0.23.2
        with:
          path: ./model-provider
          hermes-ref: v0.23.2
